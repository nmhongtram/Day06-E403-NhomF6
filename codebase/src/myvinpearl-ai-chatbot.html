<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>VinpearlAI</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { DEFAULT:'#E3A01E', dark:'#C98A12', light:'#F5C842', pale:'#FEF3C7' } } } }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif; }
    .phone-frame { width: 390px; height: 844px; background: #f5f5f5; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 40px 80px rgba(0,0,0,0.6), 0 0 0 8px #2a2a3e, 0 0 0 10px #111; }
    .screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; background: #f5f5f5; }
    .screen::-webkit-scrollbar { display: none; }

    @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    @keyframes chatUp { from{opacity:0;transform:translateY(100%)} to{opacity:1;transform:translateY(0)} }
    @keyframes checkIn { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
    @keyframes dotBounce { 0%,80%,100%{transform:scale(.6);opacity:.5} 40%{transform:scale(1);opacity:1} }
    @keyframes timerPulse { 0%,100%{opacity:1} 50%{opacity:.7} }

    .shimmer-bg { background: linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%); background-size:200% 100%; animation:shimmer 1.5s infinite; }
    .slide-up { animation: slideUp .4s ease-out both; }
    .slide-up-1 { animation-delay: .08s; }
    .slide-up-2 { animation-delay: .16s; }
    .slide-up-3 { animation-delay: .24s; }
    .fade-in { animation: fadeIn .3s ease-out both; }
    .check-in { animation: checkIn .25s ease-out both; }
    .timer-pulse { animation: timerPulse 1s ease-in-out infinite; }

    .btn-orange { background: #E3A01E; color: white; border-radius: 10px; padding: 13px 20px; font-weight: 700; font-size: 15px; width: 100%; border: none; cursor: pointer; transition: transform .15s; box-shadow: 0 3px 10px rgba(227,160,30,.4); }
    .btn-orange:active { transform: scale(0.97); }
    .btn-orange:disabled { opacity: .5; cursor: default; }
    .btn-outline { background: white; color: #E3A01E; border: 1.5px solid #E3A01E; border-radius: 10px; padding: 12px 20px; font-weight: 600; font-size: 14px; width: 100%; cursor: pointer; }
    .btn-gray { background: #ebebef; color: #444; border-radius: 10px; padding: 13px 20px; font-weight: 600; font-size: 14px; width: 100%; border: none; cursor: pointer; }

    /* Bottom Nav */
    .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: white; border-top: 1px solid #e8e8e8; display: flex; z-index: 30; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; border: none; background: transparent; padding: 6px 0 8px; }
    .nav-icon { font-size: 20px; line-height: 1; }
    .nav-label { font-size: 10px; font-weight: 500; }

    /* Chat FAB */
    .chat-fab { position: absolute; bottom: 70px; right: 14px; width: 50px; height: 50px; border-radius: 50%; background: linear-gradient(135deg,#E3A01E,#C98A12); border: none; cursor: pointer; box-shadow: 0 4px 16px rgba(227,160,30,.55); display: flex; align-items: center; justify-content: center; z-index: 40; transition: transform .15s; font-size: 22px; }
    .chat-fab:active { transform: scale(0.88); }

    /* Chat overlay */
    .chat-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; flex-direction: column; justify-content: flex-end; animation: fadeIn .2s ease-out; }
    .chat-panel { background: white; border-radius: 20px 20px 0 0; height: 85%; display: flex; flex-direction: column; animation: chatUp .3s ease-out; }
    .chat-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid #f0f0f0; border-radius: 20px 20px 0 0; flex-shrink: 0; }
    .chat-body { flex: 1; overflow-y: auto; padding: 12px 14px 8px; scrollbar-width: none; }
    .chat-body::-webkit-scrollbar { display: none; }
    .chat-footer { flex-shrink: 0; border-top: 1px solid #ebebeb; padding: 10px 14px 14px; background: white; }
    .bubble-bot { background: #f0f0f0; border-radius: 4px 16px 16px 16px; padding: 10px 14px; font-size: 13.5px; color: #222; max-width: 82%; line-height: 1.5; }
    .bubble-user { background: #1A73E8; border-radius: 16px 4px 16px 16px; padding: 10px 14px; font-size: 13.5px; color: white; max-width: 72%; margin-left: auto; line-height: 1.5; }
    .chat-input { flex: 1; background: #f5f5f5; border: none; border-radius: 22px; padding: 10px 16px; font-size: 13.5px; outline: none; }
    .quick-reply-btn { background: white; border: 1.5px solid #1A73E8; color: #1A73E8; border-radius: 22px; padding: 7px 16px; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all .15s; }
    .quick-reply-btn:active { background: #1A73E8; color: white; }
    .thinking-dot { width: 5px; height: 5px; border-radius: 50%; background: #999; display: inline-block; animation: dotBounce 1.2s infinite ease-in-out; }
    .thinking-dot:nth-child(2) { animation-delay: .2s; }
    .thinking-dot:nth-child(3) { animation-delay: .4s; }

    /* Hotel / booking UI */
    .info-bar { background: white; border-bottom: 1px solid #e5e5e5; display: flex; font-size: 11px; overflow: hidden; }
    .info-cell { flex: 1; padding: 8px 8px; border-right: 1px solid #e5e5e5; min-width: 0; }
    .info-cell:last-child { border-right: none; }
    .ta-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
    .hotel-card { background: white; border-radius: 14px; overflow: hidden; margin-bottom: 12px; box-shadow: 0 1px 8px rgba(0,0,0,.07); cursor: pointer; }
    .room-tab { background: white; display: flex; border-bottom: 2px solid #e5e5e5; }
    .room-tab-item { padding: 12px 20px; font-size: 14px; font-weight: 700; border-bottom: 2px solid transparent; margin-bottom: -2px; cursor: pointer; color: #999; }
    .room-tab-item.active { color: #E3A01E; border-bottom-color: #E3A01E; }
    .room-card { background: white; margin-bottom: 8px; }
    .step-bar-wrap { display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 20px; }
    .step-circle { width: 24px; height: 24px; border-radius: 50%; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .step-line { height: 1.5px; width: 36px; background: #ddd; }
    .form-row { margin-bottom: 18px; }
    .form-label { font-size: 12.5px; color: #555; margin-bottom: 5px; display: block; }
    .form-input { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 11px 13px; font-size: 14px; background: white; outline: none; transition: border-color .15s; }
    .form-input:focus { border-color: #E3A01E; }
    .form-select { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 11px 13px; font-size: 14px; background: white; outline: none; -webkit-appearance: none; }
    .cb-row { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; cursor: pointer; }
    .cb-box { width: 20px; height: 20px; border-radius: 4px; background: #E3A01E; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .price-footer { position: sticky; bottom: 0; background: white; border-top: 1px solid #e5e5e5; padding: 10px 16px 12px; display: flex; justify-content: space-between; align-items: center; }
    .hold-box { background: #FFF8EE; border: 1px solid #FFE4A0; border-radius: 10px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .scroll-pb { padding-bottom: 80px; }
    input:focus { outline: none; }
    select:focus { outline: none; }
  </style>
</head>

// Strip markdown syntax — prevent LLM formatting leaking into chat bubbles
function stripMd(text) {
  if (!text) return '';
  const lines = text.split('\n');
  const cleaned = [];
  for (const line of lines) {
    const t = line.trim();
    // Drop list items, numbered items, and standalone image lines
    if (!t) continue;
    if (/^[-*•]\s/.test(t)) continue;
    if (/^\d+\.\s/.test(t)) continue;
    if (/^!\[/.test(t)) continue;
    // Strip inline markdown from kept lines
    const stripped = t
      .replace(/!\[.*?\]\(.*?\)/g, '')      // inline images
      .replace(/\*\*(.+?)\*\*/g, '$1')      // **bold**
      .replace(/\*(.+?)\*/g, '$1')           // *italic*
      .replace(/`(.+?)`/g, '$1')             // `code`
      .replace(/\[(.+?)\]\(.*?\)/g, '$1')   // [link](url)
      .replace(/^#{1,6}\s+/, '')              // headers
      .trim();
    if (stripped.length > 0) cleaned.push(stripped);
  }
  return cleaned.join('\n').trim();
}

// Check if a hotel has any eligible room available on a date
function isDateAvailableForHotel(hotelId, dateStr, guestCount) {
  const allRooms = ROOMS[hotelId] || ROOMS._default || [];
  const eligible = allRooms.filter(r => r.capacity >= (guestCount || 1));
  const hotelBooked = HOTEL_AVAILABILITY[hotelId] || {};
  return eligible.some(r => !(hotelBooked[r.id] || []).includes(dateStr));
}

// Check if a specific room is available on a date
function isRoomAvailableOn(hotelId, roomId, dateStr) {
  return !((HOTEL_AVAILABILITY[hotelId] || {})[roomId] || []).includes(dateStr);
}

// Resolve relative date string → {checkin: Date, checkout: Date, nights: int}
function _resolveDateRange(str) {
  const s = (str || '').toLowerCase();
  const today = new Date(); today.setHours(0,0,0,0);
  const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
  const toISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  if (s.includes('cuối tuần này') || s.includes('weekend')) {
    const dow = today.getDay(); // 0=Sun..6=Sat
    const daysToSat = dow === 6 ? 7 : (6 - dow + 7) % 7 || 7;
    const sat = addDays(today, daysToSat);
    return { checkin: toISO(sat), checkout: toISO(addDays(sat,1)), nights: 1 };
  }
  if (s.includes('tuần tới') || s.includes('next week')) {
    const dow = today.getDay();
    const daysToMon = (8 - dow) % 7 || 7;
    const mon = addDays(today, daysToMon);
    return { checkin: toISO(mon), checkout: toISO(addDays(mon,2)), nights: 2 };
  }
  if (s.includes('tháng sau') || s.includes('next month')) {
    const nm = new Date(today.getFullYear(), today.getMonth()+1, 1);
    return { checkin: toISO(nm), checkout: toISO(addDays(nm,2)), nights: 2 };
  }
  // Try to parse "từ ngày X đến ngày Y" or "7/6" style
  const rangeMatch = s.match(/(\d{1,2})[\/\-](\d{1,2}).*?(\d{1,2})[\/\-](\d{1,2})/);
  if (rangeMatch) {
    const y = today.getFullYear();
    const ci = new Date(y, parseInt(rangeMatch[2])-1, parseInt(rangeMatch[1]));
    const co = new Date(y, parseInt(rangeMatch[4])-1, parseInt(rangeMatch[3]));
    const nights = Math.max(1, Math.round((co-ci)/86400000));
    return { checkin: toISO(ci), checkout: toISO(co), nights };
  }
  const nightsMatch = s.match(/(\d+)\s*(?:đêm|ngày|nights?)/);
  if (nightsMatch) {
    const n = parseInt(nightsMatch[1]);
    const ci = addDays(today, 1);
    return { checkin: toISO(ci), checkout: toISO(addDays(ci, n)), nights: n };
  }
  return null;
}

// Map backend ui_state → frontend destination info for navigation action
function _uiStateToAction(ui_state, result_data, entities) {
  if (ui_state === 'show_destinations') {
    const dest = entities?.destination?.toLowerCase() || '';
    const destId = dest.includes('phú quốc') || dest.includes('phu quoc') ? 'pq'
      : dest.includes('nha trang') ? 'nt'
      : dest.includes('đà nẵng') || dest.includes('hội an') ? 'dn'
      : 'pq';
    return { type:'navigate', screen:'hotel_list', dest: destId, backendDests: result_data?.destinations };
  }
  if (ui_state === 'show_hotels') {
    return { type:'navigate', screen:'hotel_list', dest: result_data?.destination_id, backendHotels: result_data?.hotels };
  }
  if (ui_state === 'show_change_booking') return { type:'navigate', screen:'change_booking', data: result_data };
  if (ui_state === 'show_cancel_booking') return { type:'navigate', screen:'cancel_booking', data: result_data };
  return null;
}

// Quick-replies based on ui_state
function _uiStateReplies(ui_state, result_data) {
  if (ui_state === 'ask_clarification') return result_data?.quick_replies || [];
  if (ui_state === 'show_destinations') return [];
  if (ui_state === 'show_hotels') return [];
  if (ui_state === 'show_change_booking') return ['Xem đổi ngày →'];
  if (ui_state === 'show_cancel_booking') return ['Xem hủy booking →'];
  if (ui_state === 'show_message') return ['🏨 Tìm khách sạn', '💬 Hỏi thêm'];
  if (ui_state === 'show_failure') return ['🔄 Thử lại', '📞 Liên hệ CSKH'];
  return ['🏨 Tìm khách sạn', '🔄 Đổi booking', '❌ Hủy booking'];
}

// Detect correction intent on the frontend (supplement to backend classification)
function _isCorrection(text) {
  return /không phải|nhầm rồi|sai rồi|sửa lại|đổi lại|ý tôi là|thực ra là|\d+ người/i.test(text);
}

// Call backend /api/chat via SSE; yields thinking items then final reply object
async function callBackendChat(message, onThinkingItem, context, history) {
  if (!API_BASE && API_BASE !== '') {
    // File:// mode — simple keyword fallback
    await delay(800);
    const lower = message.toLowerCase();
    if (lower.includes('phú quốc') || lower.includes('phu quoc')) {
      return { text:`Phú Quốc — lựa chọn tuyệt vời! 🏖`, ui_state:'show_destinations',
        quick_replies:['Xem danh sách →'], action:{type:'navigate',screen:'hotel_list',dest:'pq'} };
    }
    if (lower.includes('muốn đổi') || lower.includes('đổi booking')) {
      return { text:'Bạn muốn đổi booking nào? Cho tôi mã booking VNP-... nhé.', ui_state:'ask_clarification',
        quick_replies:['Tìm booking tự động', 'Nhập mã booking'], result_data: { quick_replies: ['Tìm booking tự động','Nhập mã booking'] } };
    }
    return { text:`Bạn muốn làm gì, ${USER.short}?`, ui_state:'show_message',
      quick_replies:['🏨 Tìm khách sạn','🔄 Đổi booking','❌ Hủy booking'], action:null };
  }

  const body = { message, user_id: 'demo_user' };
  if (context && Object.keys(context).length > 0) body.context = context;
  // Send last 10 messages as conversation history so agent has multi-turn context
  if (history && history.length > 0) body.history = history;

  const resp = await fetch(`${API_BASE}/api/chat`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();

    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      // Parse JSON separately — catch only parse errors, not event-handling errors
      let ev;
      try { ev = JSON.parse(line.slice(6)); } catch (_) { continue; }

      if (ev.type === 'thinking_item') {
        onThinkingItem && onThinkingItem(ev);
      } else if (ev.type === 'thinking_start' || ev.type === 'thinking_progress') {
        // Progress events — no action needed
      } else if (ev.type === 'result') {
        const ui = ev.ui_state;
        const action = _uiStateToAction(ui, ev.result_data, ev.entities);
        const replies = _uiStateReplies(ui, ev.result_data);
        const text = ev.llm_response || (ui === 'show_destinations'
          ? 'Tôi tìm thấy một số địa điểm phù hợp cho bạn! 🏖'
          : 'Xong rồi! Bạn muốn làm gì tiếp theo?');
        return { text, ui_state: ui, quick_replies: replies, action,
          result_data: ev.result_data, entities: ev.entities };
      } else if (ev.type === 'error') {
        // Backend error — propagate the real message, don't swallow it
        throw new Error(ev.message || 'Lỗi từ agent');
      }
    }
  }
  throw new Error('Stream kết thúc không có kết quả');
}

// ── Availability Calendar Widget ─────────────────────────────────────────────
function AvailabilityCalendar({ hotel, guestCount, preCheckin, preCheckout, onConfirm }) {
  const today = new Date(); today.setHours(0,0,0,0);
  const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
  // Use local date parts — toISOString() is UTC and causes off-by-one in UTC+7
  const toISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const DAY_NAMES = ['CN','T.2','T.3','T.4','T.5','T.6','T.7'];
  const MONTH_VN = ['Th.1','Th.2','Th.3','Th.4','Th.5','Th.6','Th.7','Th.8','Th.9','Th.10','Th.11','Th.12'];

  // Build 21 days starting from today
  const days = Array.from({length:21}, (_,i) => {
    const d = addDays(today, i);
    const iso = toISO(d);
    const avail = isDateAvailableForHotel(hotel?.id, iso, guestCount);
    const isPast = d < today;
    return { d, iso, avail, isPast, dow: d.getDay(), day: d.getDate(), month: d.getMonth()+1 };
  });

  const [checkin, setCheckin] = useState(preCheckin || null);
  const [checkout, setCheckout] = useState(preCheckout || null);
  const [step, setStep] = useState(preCheckin ? (preCheckout ? 'done' : 'checkout') : 'checkin');

  const handleDayClick = (iso, avail) => {
    if (!avail) return;
    if (step === 'checkin') { setCheckin(iso); setCheckout(null); setStep('checkout'); }
    else if (step === 'checkout') {
      if (iso <= checkin) { setCheckin(iso); setCheckout(null); return; }
      setCheckout(iso); setStep('done');
    } else { setCheckin(iso); setCheckout(null); setStep('checkout'); }
  };

  const nights = checkin && checkout
    ? Math.round((new Date(checkout) - new Date(checkin)) / 86400000)
    : 0;

  const isInRange = (iso) => checkin && checkout && iso > checkin && iso < checkout;
  // Parse ISO "YYYY-MM-DD" as local date to avoid timezone shift
  const fmtDate = iso => { const [,m,d] = iso.split('-'); return `${parseInt(d)}/${parseInt(m)}`; };

  return (
    <div style={{ background:'white', borderRadius:14, overflow:'hidden', boxShadow:'0 2px 10px rgba(0,0,0,.08)', width:'100%' }}>
      <div style={{ background:'linear-gradient(135deg,#E3A01E,#C98A12)', padding:'10px 14px' }}>
        <p style={{ color:'white', fontWeight:700, fontSize:13, margin:0 }}>📅 Chọn ngày nhận phòng</p>
        <p style={{ color:'rgba(255,255,255,.8)', fontSize:11, margin:'2px 0 0' }}>
          {step === 'checkin' ? 'Tap ngày check-in' : step === 'checkout' ? `Check-in: ${fmtDate(checkin)} — Tap ngày check-out` : `${fmtDate(checkin)} → ${fmtDate(checkout)} (${nights} đêm)`}
        </p>
      </div>

      {/* Day grid */}
      <div style={{ padding:'10px 8px', display:'flex', flexWrap:'wrap', gap:4 }}>
        {days.map(({ d, iso, avail, isPast, dow, day, month }) => {
          const isCi = iso === checkin;
          const isCo = iso === checkout;
          const inRange = isInRange(iso);
          const disabled = !avail || isPast;
          const isWeekend = dow === 0 || dow === 6;
          let bg = 'white', color = '#333', border = '1px solid #eee';
          if (disabled)  { bg='#f5f5f5'; color='#bbb'; border='1px solid #f0f0f0'; }
          if (inRange)   { bg='#FFF5E0'; color='#C98A12'; border='1px solid #F5D78C'; }
          if (isCi||isCo){ bg='#E3A01E'; color='white'; border='1px solid #E3A01E'; }
          return (
            <div key={iso} onClick={() => handleDayClick(iso, !disabled)}
              style={{ width:'calc(14.28% - 4px)', minWidth:36, aspectRatio:'1', display:'flex', flexDirection:'column',
                alignItems:'center', justifyContent:'center', borderRadius:8, cursor: disabled?'not-allowed':'pointer',
                background:bg, border, transition:'all .15s', boxSizing:'border-box', padding:2 }}>
              <span style={{ fontSize:8, color: disabled?'#ccc' : isWeekend?'#E3A01E':'#999', fontWeight:500, lineHeight:1 }}>
                {DAY_NAMES[dow]}
              </span>
              <span style={{ fontSize:12, fontWeight: (isCi||isCo)?800:600, color, lineHeight:1.3 }}>{day}</span>
              {month !== days[0].month && <span style={{ fontSize:7, color:'#aaa', lineHeight:1 }}>/{month}</span>}
              {!disabled && <span style={{ width:4, height:4, borderRadius:'50%', background: (isCi||isCo)?'rgba(255,255,255,.7)':'#4CAF50', marginTop:1 }} />}
              {disabled && !isPast && <span style={{ fontSize:7, color:'#ddd', lineHeight:1 }}>Full</span>}
            </div>
          );
        })}
      </div>

      {/* Legend */}
      <div style={{ display:'flex', gap:10, padding:'0 12px 8px', fontSize:10, color:'#888', alignItems:'center' }}>
        <span>🟢 Còn phòng</span><span>⬜ Hết phòng</span>{checkin&&checkout&&<span style={{color:'#E3A01E',fontWeight:700}}>🟡 Đã chọn</span>}
      </div>

      {/* Confirm button */}
      {step === 'done' && (
        <div style={{ padding:'0 12px 12px' }}>
          <button onClick={() => onConfirm(checkin, checkout, nights)}
            style={{ width:'100%', background:'#E3A01E', color:'white', border:'none', borderRadius:10,
              padding:'11px', fontSize:13, fontWeight:700, cursor:'pointer' }}>
            ✓ Xác nhận {fmtDate(checkin)} → {fmtDate(checkout)} ({nights} đêm)
          </button>
        </div>
      )}
    </div>
  );
}

  const [messages, setMessages] = useState([
    { id:1, from:'bot', type:'text', text:`Xin chào, ${USER.short}! 👋`, time:new Date() },
    { id:2, from:'bot', type:'text', text:`Xin chào! Tôi là ${APP_NAME} — trợ lý AI đặt phòng Vinpearl.\nTôi có thể giúp bạn tìm phòng, đổi / hủy booking, hoặc trả lời câu hỏi.`,
      quick_replies:['🏨 Tìm khách sạn','🔄 Đổi booking','❌ Hủy booking'] },
  ]);
  const [input, setInput] = useState('');
  const [typing, setTyping] = useState(false);
  const [inputDisabled, setInputDisabled] = useState(false);
  const [pendingReplies, setPendingReplies] = useState(['🏨 Tìm khách sạn','🔄 Đổi booking','❌ Hủy booking']);

  // Booking flow state
  const [selectedHotel, setSelectedHotel] = useState(null);
  const [selectedRoom, setSelectedRoom] = useState(null);
  const [guestCount, setGuestCount] = useState(2);
  const [awaitingGuestCount, setAwaitingGuestCount] = useState(false);
  const [awaitingDatePick, setAwaitingDatePick] = useState(false);
  const [checkinDate, setCheckinDate] = useState(null);   // 'YYYY-MM-DD'
  const [checkoutDate, setCheckoutDate] = useState(null); // 'YYYY-MM-DD'
  const [bookingInfo, setBookingInfo] = useState({ name: USER.first_name, email: USER.email, guests: 2 });
  // Correction flow: remember last search entities so backend can merge on correction
  const [lastEntities, setLastEntities] = useState({});
  // Clarify flow: what was the last clarify question asking for?
  // 'destination' | 'booking' | null
  const [clarifyContext, setClarifyContext] = useState(null);
  // Booking ref tracking: pass to backend on change/cancel so it can validate
  const savedBookingRef = useRef(null);

  const bodyRef = useRef(null);
  useEffect(() => {
    if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight;
  }, [messages, typing]);

  const push = (msg) => setMessages(prev => [...prev, { id: nextId(), time: new Date(), ...msg }]);

  // Destination name → object lookup (for bypassing backend on clarify answers)
  const DEST_LOOKUP = {
    'phú quốc': { id:'pq', name:'Phú Quốc', image:HOTELS.pq?.[0]?.image, match_score:95, rating:4.8, reasons:['Biển đẹp nhất miền Nam','Lý tưởng cho gia đình'] },
    'phu quoc': { id:'pq', name:'Phú Quốc', image:HOTELS.pq?.[0]?.image, match_score:95, rating:4.8, reasons:['Biển đẹp nhất miền Nam','Lý tưởng cho gia đình'] },
    'nha trang': { id:'nt', name:'Nha Trang', image:HOTELS.nt?.[0]?.image, match_score:90, rating:4.6, reasons:['Vịnh biển xanh đẹp','Nhiều hoạt động lặn biển'] },
    'hội an': { id:'dn', name:'Hội An', image:HOTELS.dn?.[0]?.image, match_score:88, rating:4.8, reasons:['Phố cổ UNESCO','Sân golf & Biển An Bàng'] },
    'hoi an': { id:'dn', name:'Hội An', image:HOTELS.dn?.[0]?.image, match_score:88, rating:4.8, reasons:['Phố cổ UNESCO','Sân golf & Biển An Bàng'] },
    'đà nẵng': { id:'dn', name:'Hội An', image:HOTELS.dn?.[0]?.image, match_score:85, rating:4.8, reasons:['Gần Đà Nẵng','Phố cổ UNESCO'] },
    'da nang': { id:'dn', name:'Hội An', image:HOTELS.dn?.[0]?.image, match_score:85, rating:4.8, reasons:['Gần Đà Nẵng','Phố cổ UNESCO'] },
    'hạ long': { id:'hl', name:'Hạ Long', image:HOTELS.hl?.[0]?.image, match_score:88, rating:4.7, reasons:['Di sản thiên nhiên thế giới','Vịnh đảo vôi hùng vĩ'] },
    'ha long': { id:'hl', name:'Hạ Long', image:HOTELS.hl?.[0]?.image, match_score:88, rating:4.7, reasons:['Di sản thiên nhiên thế giới','Vịnh đảo vôi hùng vĩ'] },
    'hà tĩnh': { id:'ht', name:'Hà Tĩnh', image:HOTELS.ht?.[0]?.image, match_score:80, rating:4.4, reasons:['Biển Cửa Sót hoang sơ','Yên tĩnh & gần gũi thiên nhiên'] },
    'ha tinh': { id:'ht', name:'Hà Tĩnh', image:HOTELS.ht?.[0]?.image, match_score:80, rating:4.4, reasons:['Biển Cửa Sót hoang sơ','Yên tĩnh & gần gũi thiên nhiên'] },
    'nghệ an': { id:'na', name:'Nghệ An', image:HOTELS.na?.[0]?.image, match_score:79, rating:4.4, reasons:['Biển Cửa Hội xinh đẹp','Gần thành phố Vinh'] },
    'nghe an': { id:'na', name:'Nghệ An', image:HOTELS.na?.[0]?.image, match_score:79, rating:4.4, reasons:['Biển Cửa Hội xinh đẹp','Gần thành phố Vinh'] },
    'bắc ninh': { id:'bn', name:'Bắc Ninh', image:HOTELS.bn?.[0]?.image, match_score:75, rating:4.3, reasons:['Gần Hà Nội','Tiện công tác & nghỉ dưỡng'] },
    'bac ninh': { id:'bn', name:'Bắc Ninh', image:HOTELS.bn?.[0]?.image, match_score:75, rating:4.3, reasons:['Gần Hà Nội','Tiện công tác & nghỉ dưỡng'] },
  };

  // ── Flow handlers ─────────────────────────────────────────────────────────

  const handleDestSelect = (dest) => {
    push({ from:'user', type:'text', text:`Chọn ${dest.name}` });
    setPendingReplies([]);
    const hotels = HOTELS[dest.id] || HOTELS.pq;
    setTimeout(() => {
      push({ from:'bot', type:'hotels', text:`Các khách sạn Vinpearl tại ${dest.name} 🏨`, hotels });
    }, 400);
  };

  const handleHotelSelect = (hotel) => {
    setSelectedHotel(hotel);
    push({ from:'user', type:'text', text:`Chọn ${hotel.name}` });
    setPendingReplies([]);

    // If guest count already known from search entities → skip question
    const knownGuests = lastEntities.guest_count ? parseInt(lastEntities.guest_count) : 0;
    const knownDateStr  = lastEntities.date_range || lastEntities.date || lastEntities.checkin || '';
    const resolvedDates = knownDateStr ? _resolveDateRange(knownDateStr) : null;

    const showCalendar = (guests) => {
      setAwaitingDatePick(true);
      setAwaitingGuestCount(false);
      if (resolvedDates) {
        setCheckinDate(resolvedDates.checkin);
        setCheckoutDate(resolvedDates.checkout);
      }
      setTimeout(() => {
        push({ from:'bot', type:'availability',
          text: `📅 Chọn ngày cho ${guests} người tại ${hotel.name.split(' ').slice(0,4).join(' ')}`,
          hotel, guestCount: guests,
          preCheckin: resolvedDates?.checkin || null,
          preCheckout: resolvedDates?.checkout || null });
      }, 400);
    };

    if (knownGuests > 0) {
      setGuestCount(knownGuests);
      setBookingInfo(prev => ({ ...prev, guests: knownGuests }));
      showCalendar(knownGuests);
    } else {
      setGuestCount(2);
      setAwaitingGuestCount(true);
      setTimeout(() => {
        push({ from:'bot', type:'text', text:`Tuyệt! Bạn đi bao nhiêu người để tôi gợi ý phòng phù hợp nhất? 👥` });
        setPendingReplies(['1 người', '2 người', '3 người', '4 người', '5-6 người', '7+ người']);
      }, 400);
    }
  };

  const handleGuestCountSelect = (count) => {
    setGuestCount(count);
    setBookingInfo(prev => ({ ...prev, guests: count }));
    setAwaitingGuestCount(false);
    setPendingReplies([]);

    const knownDateStr  = lastEntities.date_range || lastEntities.date || lastEntities.checkin || '';
    const resolvedDates = knownDateStr ? _resolveDateRange(knownDateStr) : null;
    if (resolvedDates) {
      setCheckinDate(resolvedDates.checkin);
      setCheckoutDate(resolvedDates.checkout);
    }

    setTimeout(() => {
      push({ from:'bot', type:'availability',
        text: `📅 Chọn ngày cho ${count} người tại ${(selectedHotel?.name||'').split(' ').slice(0,4).join(' ')}`,
        hotel: selectedHotel, guestCount: count,
        preCheckin: resolvedDates?.checkin || null,
        preCheckout: resolvedDates?.checkout || null });
      setAwaitingDatePick(true);
    }, 400);
  };

  const handleDateConfirm = (checkin, checkout, nights) => {
    setCheckinDate(checkin);
    setCheckoutDate(checkout);
    setAwaitingDatePick(false);
    push({ from:'user', type:'text', text:`Check-in ${checkin.split('-').slice(1).reverse().join('/')} → Check-out ${checkout.split('-').slice(1).reverse().join('/')} (${nights} đêm)` });
    setPendingReplies([]);
    const allRooms = ROOMS[selectedHotel?.id] || ROOMS._default || [];
    // Filter by capacity AND availability on checkin date
    const eligible = allRooms.filter(r => r.capacity >= guestCount);
    const available = eligible.filter(r => isRoomAvailableOn(selectedHotel?.id, r.id, checkin));
    const rooms = available.length > 0 ? available : (eligible.length > 0 ? eligible : allRooms);
    setTimeout(() => {
      push({ from:'bot', type:'rooms',
        text: `Phòng còn trống cho ${guestCount} người (${checkin.split('-').slice(1).reverse().join('/')} – ${checkout.split('-').slice(1).reverse().join('/')}) 🛏`,
        rooms });
    }, 400);
  };

  const handleRoomSelect = (room) => {
    setSelectedRoom(room);
    push({ from:'user', type:'text', text:`Chọn ${room.name}` });
    setPendingReplies([]);
    // Embed dates into bookingInfo so BookingConfirmWidget can display them
    const info = { ...bookingInfo, checkin: checkinDate, checkout: checkoutDate, guests: guestCount };
    setBookingInfo(info);
    setTimeout(() => {
      push({ from:'bot', type:'user_info', text:'Vui lòng điền thông tin để hoàn tất đặt phòng:',
        info });
    }, 400);
  };

  const handleInfoConfirm = (info) => {
    setBookingInfo(info);
    push({ from:'user', type:'text', text:`${info.name} · ${info.email}` });
    setTimeout(() => {
      push({ from:'bot', type:'booking_confirm', text:'Xác nhận đặt phòng của bạn:',
        hotel: selectedHotel, room: selectedRoom, info });
    }, 400);
  };

  const handleBookingConfirm = async (paymentMethod) => {
    const ref = 'VNP-' + new Date().getFullYear() + '-' + (Math.floor(Math.random() * 9000) + 1000);
    savedBookingRef.current = ref;   // save so future change/cancel can reference it
    // Optionally notify backend
    if (API_BASE && API_BASE !== '') {
      try {
        await fetch(`${API_BASE}/api/book`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            hotel_id: selectedHotel?.id,
            room_id: selectedRoom?.id,
            checkin: '2026-06-05',
            checkout: '2026-06-06',
            guests: bookingInfo.guests,
            user_name: bookingInfo.name,
            email: bookingInfo.email,
            payment_method: paymentMethod || 'vnpay',
          }),
        });
      } catch(_) {}
    }
    await delay(700);
    push({ from:'bot', type:'booking_success', text:'',
      bookingRef: ref, hotel: selectedHotel, room: selectedRoom, email: bookingInfo.email, paymentMethod });
    setPendingReplies(['🏠 Về trang chủ']);
  };

  const handleBookingCancel = () => {
    push({ from:'bot', type:'text', text:'Đã hủy. Bạn muốn chọn phòng khác không?',
      quick_replies: ['🔄 Chọn phòng khác', '🏠 Về trang chủ'] });
    setPendingReplies(['🔄 Chọn phòng khác', '🏠 Về trang chủ']);
  };

  // ── Main send ─────────────────────────────────────────────────────────────

  const sendMessage = async (text) => {
    if (!text.trim() || typing) return;

    // ── Clarify destination shortcut: bypass backend entirely ─────────────────
    // When bot asked "where do you want to go?" and user picks a destination
    if (clarifyContext === 'destination') {
      const destObj = DEST_LOOKUP[text.toLowerCase().trim()];
      if (destObj) {
        setClarifyContext(null);
        setInput('');
        push({ from:'user', type:'text', text });
        setPendingReplies([]);
        setTyping(true);
        await delay(400);
        setTyping(false);
        handleDestSelect(destObj);
        return;
      }
    }

    // ── Guest count shortcut: when bot asked "đi bao nhiêu người?" ────────────
    if (awaitingGuestCount && selectedHotel) {
      const guestMap = { '1 người':1, '2 người':2, '3 người':3, '4 người':4, '5-6 người':5, '7+ người':7 };
      const count = guestMap[text] ?? parseInt((text.match(/(\d+)/)||[])[1] || '0');
      if (count > 0) {
        setInput('');
        push({ from:'user', type:'text', text });
        handleGuestCountSelect(count);
        return;
      }
    }

    setInput('');
    push({ from:'user', type:'text', text });
    setPendingReplies([]);
    setTyping(true);
    setInputDisabled(true);

    // Build context (booking_ref for change/cancel validation)
    const context = {
      ...(savedBookingRef.current ? { booking_ref: savedBookingRef.current } : {}),
    };

    // Build conversation history — last 10 text messages for multi-turn context
    const history = messages
      .filter(m => m.type === 'text' && (m.from === 'user' || m.from === 'bot'))
      .slice(-10)
      .map(m => ({ role: m.from === 'user' ? 'user' : 'assistant', content: m.text || '' }))
      .filter(m => m.content.length > 0);

    try {
      const reply = await callBackendChat(text, null, context, history);
      setTyping(false);
      setInputDisabled(false);

      const ui = reply.ui_state;

      if (ui === 'show_hotels' && reply.result_data?.hotels?.length) {
        // Hotels already filtered (by date or destination) → skip destination step
        if (reply.entities) setLastEntities(reply.entities);
        setClarifyContext(null);
        const rd = reply.result_data;
        const byDate = !!rd.by_date;   // true = LLM used search_hotels_by_date
        const hotels = rd.hotels.map(h => ({
          id: h.id, name: h.name, location: h.location || rd.destination || h.name,
          rating: h.rating || 4.5,
          price: h.price_from || h.price || h.price_per_night,
          image: h.image || 'https://images.unsplash.com/photo-1540541338537-44a2b28e84f3?w=700&q=80',
          attributes: h.attributes || [],
          // Date availability badge
          checkin: h.checkin || rd.checkin,
          checkout: h.checkout || rd.checkout,
          available_rooms_count: h.available_rooms_count,
          has_availability: h.has_availability || byDate,
          nights: h.nights || rd.nights || 1,
        }));
        // Only show intro text if short — skip if LLM generated a long markdown list
        const introText = stripMd(reply.text || '');
        if (introText && introText.split('\n')[0].length <= 100) {
          push({ from:'bot', type:'text', text: introText.split('\n')[0] });
        }
        setTimeout(() => {
          push({ from:'bot', type:'hotels',
            text: byDate ? `Các khách sạn còn trống ngày ${rd.checkin} 📅` : '',
            hotels, byDate, checkin: rd.checkin });
        }, 300);
        setTimeout(() => setPendingReplies(['🔄 Tìm ngày khác', '🔄 Đổi địa điểm', '💬 Hỏi thêm']), 350);
      } else if (ui === 'show_destinations' && reply.result_data?.destinations?.length) {
        // Save entities for potential correction next turn
        if (reply.entities) setLastEntities(reply.entities);
        setClarifyContext(null);
        const destIntro = stripMd(reply.text || '');
        if (destIntro && destIntro.split('\n')[0].length <= 100) {
          push({ from:'bot', type:'text', text: destIntro.split('\n')[0] });
        }
        setTimeout(() => {
          push({ from:'bot', type:'destinations', text:'', destinations: reply.result_data.destinations });
        }, 300);
        // Subtle correction quick-replies after showing destinations
        setTimeout(() => setPendingReplies(['🔄 Sửa: Nhiều người hơn', '🔄 Sửa: Địa điểm khác', '💬 Hỏi thêm']), 350);
      } else if (ui === 'ask_clarification') {
        // LOW-CONFIDENCE PATH: show the question + quick replies
        const qr = reply.result_data?.quick_replies || reply.quick_replies || [];
        push({ from:'bot', type:'text', text: reply.text });
        // Track what the bot is asking for so next user input can short-circuit
        const destReplies = ['Phú Quốc','Nha Trang','Đà Nẵng','Hạ Long'];
        if (qr.some(r => destReplies.includes(r))) {
          setClarifyContext('destination');
        } else if (qr.includes('Tìm booking tự động') || qr.includes('Nhập mã booking')) {
          setClarifyContext('booking');
        }
        if (qr.length > 0) setPendingReplies(qr);
        else setPendingReplies([]);
      } else if (ui === 'show_failure') {
        // FAILURE PATH: show FailureWidget
        push({ from:'bot', type:'text', text: reply.text });
        setTimeout(() => {
          push({ from:'bot', type:'failure',
            reason: reply.result_data?.failure_reason,
            cskh: reply.result_data?.cskh || { phone:'1800 1234', chat_url:'#', policy_url:'#' },
          });
        }, 300);
        setPendingReplies([]);
      } else {
        // Save entities from QA/other responses too (for multi-turn context like "có" after "tìm phòng không?")
        if (reply.entities && Object.keys(reply.entities).length > 0) setLastEntities(reply.entities);
        push({ from:'bot', type:'text', text: reply.text, quick_replies: reply.quick_replies });
        setPendingReplies(reply.quick_replies || []);
      }
    } catch(e) {
      setTyping(false);
      setInputDisabled(false);
      push({ from:'bot', type:'text', text:`Xin lỗi, không kết nối được backend. (${e.message})`, quick_replies:['Thử lại'] });
      setPendingReplies(['Thử lại']);
    }
  };

  const fmtTime = d => {
    const h = d.getHours(), m = d.getMinutes();
    return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${h >= 12 ? 'PM' : 'AM'}`;
  };

  // ── Render each message ───────────────────────────────────────────────────

  const renderContent = (msg) => {
    switch(msg.type) {
      case 'destinations':
        return <DestinationsWidget destinations={msg.destinations} onSelect={handleDestSelect} />;
      case 'hotels':
        return (
          <div>
            {msg.text && <p style={{ fontSize:13, color:'#333', marginBottom:8, lineHeight:1.4 }}>{msg.text}</p>}
            <HotelsWidget hotels={msg.hotels} onSelect={handleHotelSelect} byDate={msg.byDate} checkin={msg.checkin} />
          </div>
        );
      case 'availability':
        return (
          <div>
            {msg.text && <p style={{ fontSize:13, color:'#333', marginBottom:8, lineHeight:1.4 }}>{msg.text}</p>}
            <AvailabilityCalendar
              hotel={msg.hotel} guestCount={msg.guestCount}
              preCheckin={msg.preCheckin} preCheckout={msg.preCheckout}
              onConfirm={handleDateConfirm} />
          </div>
        );
      case 'rooms':
        return (
          <div>
            {msg.text && <p style={{ fontSize:13, color:'#333', marginBottom:8, lineHeight:1.4 }}>{msg.text}</p>}
            <RoomsWidget rooms={msg.rooms} onSelect={handleRoomSelect} />
          </div>
        );
      case 'user_info':
        return (
          <div>
            {msg.text && <p style={{ fontSize:13, color:'#333', marginBottom:8 }}>{msg.text}</p>}
            <UserInfoWidget initialInfo={msg.info} onConfirm={handleInfoConfirm} />
          </div>
        );
      case 'booking_confirm':
        return (
          <div>
            {msg.text && <p style={{ fontSize:13, color:'#333', marginBottom:8 }}>{msg.text}</p>}
            <BookingConfirmWidget
              hotel={msg.hotel} room={msg.room} info={msg.info}
              onConfirm={handleBookingConfirm}
              onCancel={handleBookingCancel}
            />
          </div>
        );
      case 'booking_success':
        return <BookingSuccessWidget bookingRef={msg.bookingRef} hotel={msg.hotel} room={msg.room} email={msg.email} paymentMethod={msg.paymentMethod} />;
      case 'failure':
        return <FailureWidget message={msg.text} reason={msg.reason} cskh={msg.cskh}
          onRetry={() => { setPendingReplies(['🏨 Tìm khách sạn','🔄 Đổi booking','❌ Hủy booking']); }} />;
      default:
        return <div className="bubble-bot" style={{ whiteSpace:'pre-line' }}>{stripMd(msg.text)}</div>;
    }
  };

  const isWideType = (t) => ['destinations','hotels','rooms','user_info','booking_confirm','booking_success','failure'].includes(t);

  let lastDate = '';
  const getDateLabel = (d) => {
    const label = d.toDateString() === new Date().toDateString() ? 'Hôm nay' : d.toLocaleDateString('vi-VN');
    if (label !== lastDate) { lastDate = label; return label; }
    return null;
  };

  return (
    <div className="chat-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="chat-panel">
        {/* Header */}
        <div className="chat-header">
          <button onClick={onClose} style={{ background:'none', border:'none', cursor:'pointer', fontSize:20, color:'#555', paddingRight:4 }}>←</button>
          <div style={{ width:40, height:40, borderRadius:'50%', background:'white', border:'1.5px solid #eee', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, overflow:'hidden', padding:4 }}>
            <img src={VINPEARL_LOGO} alt="Vinpearl" style={{ width:'100%', height:'100%', objectFit:'contain' }} />
          </div>
          <div style={{ flex:1 }}>
            <p style={{ fontSize:15, fontWeight:700, color:'#111' }}>{APP_NAME}</p>
            <p style={{ fontSize:11, color:'#34A853', fontWeight:600 }}>● Trực tuyến</p>
          </div>
          <button style={{ background:'none', border:'none', cursor:'pointer', fontSize:20, color:'#888' }}>⋮</button>
        </div>

        {/* Messages */}
        <div className="chat-body" ref={bodyRef}>
          {messages.map((msg, idx) => {
            const dateLabel = msg.time ? getDateLabel(msg.time) : null;
            const showVALabel = msg.from === 'bot' && (idx === 0 || messages[idx-1]?.from !== 'bot');
            const wide = msg.from === 'bot' && isWideType(msg.type);
            return (
              <div key={msg.id}>
                {dateLabel && (
                  <div style={{ textAlign:'center', fontSize:11, color:'#bbb', margin:'6px 0 10px', fontWeight:600 }}>{dateLabel}</div>
                )}
                {msg.from === 'bot' ? (
                  <div style={{ marginBottom:12 }}>
                    {showVALabel && <p style={{ fontSize:11, color:'#999', fontWeight:600, marginBottom:4 }}>VinpearlAI</p>}
                    <div style={{ maxWidth: wide ? '96%' : '84%' }}>
                      {renderContent(msg)}
                    </div>
                    {msg.time && <p style={{ fontSize:10, color:'#bbb', marginTop:3 }}>{fmtTime(msg.time)}</p>}
                  </div>
                ) : (
                  <div style={{ marginBottom:12 }}>
                    <div style={{ display:'flex', justifyContent:'flex-end' }}>
                      <div className="bubble-user">{msg.text}</div>
                    </div>
                    {msg.time && <p style={{ fontSize:10, color:'#bbb', marginTop:3, textAlign:'right' }}>{fmtTime(msg.time)}</p>}
                  </div>
                )}
              </div>
            );
          })}

          {typing && (
            <div style={{ marginBottom:12 }}>
              <p style={{ fontSize:11, color:'#999', fontWeight:600, marginBottom:4 }}>VinpearlAI</p>
              <div className="bubble-bot" style={{ display:'inline-flex', gap:4, alignItems:'center', padding:'12px 16px' }}>
                <span className="thinking-dot"/><span className="thinking-dot"/><span className="thinking-dot"/>
              </div>
            </div>
          )}

          {pendingReplies.length > 0 && !typing && (
            <div style={{ display:'flex', flexWrap:'wrap', gap:8, marginBottom:12 }}>
              {pendingReplies.map(r => (
                <button key={r} className="quick-reply-btn" onClick={() => sendMessage(r)}>{r}</button>
              ))}
            </div>
          )}
        </div>

        {/* Input */}
        <div className="chat-footer">
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <button style={{ width:34, height:34, borderRadius:'50%', background:'#f0f0f0', border:'none', cursor:'pointer', fontSize:16, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>＋</button>
            <input className="chat-input" value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && sendMessage(input)}
              placeholder={inputDisabled ? 'Đang xử lý...' : 'Nhập tin nhắn...'}
              disabled={inputDisabled}
            />
            <button onClick={() => sendMessage(input)}
              style={{ width:34, height:34, borderRadius:'50%', background: input.trim() ? '#E3A01E' : '#e5e5e5', border:'none', cursor:'pointer', fontSize:16, color: input.trim() ? 'white' : '#aaa', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, transition:'background .2s' }}>
              ➤
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

    return () => clearInterval(t);
  }, []);
  const mm = String(Math.floor(holdSecs / 60)).padStart(2, '0');
  const ss = String(holdSecs % 60).padStart(2, '0');

  return (
    <div className="screen" style={{ background:'#f2f2f2' }}>
      <StatusBar />
      <div style={{ background:'white', borderBottom:'1px solid #eee', padding:'8px 16px 10px', display:'flex', alignItems:'center', gap:8 }}>
        <button onClick={onBack} style={{ background:'none', border:'none', fontSize:20, cursor:'pointer', color:'#333', padding:'0 8px 0 0' }}>←</button>
        <span style={{ fontSize:17, fontWeight:700, color:'#111' }}>Tổng kết hành trình</span>
      </div>

      <div style={{ padding:'14px 14px 0' }}>
        {/* Hold timer */}
        <div className="hold-box fade-in">
          <span style={{ fontSize:13, fontWeight:600, color:'#555' }}>Thời gian giữ phòng</span>
          <span style={{ fontSize:20, fontWeight:900, color:'#E3A01E' }} className={holdSecs < 60 ? 'timer-pulse' : ''}>{mm}:{ss}</span>
        </div>

        {/* Hotel info */}
        <div style={{ background:'white', borderRadius:14, padding:'14px', marginBottom:10, boxShadow:'0 1px 6px rgba(0,0,0,.06)' }} className="slide-up">
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10 }}>
            <span style={{ fontSize:20 }}>🏨</span>
            <span style={{ fontSize:14, fontWeight:700, color:'#333' }}>Thông tin khách sạn</span>
          </div>
          <p style={{ fontSize:14, fontWeight:700, color:'#1A56DB', marginBottom:6 }}>{hotel?.name || 'Vinpearl Wonderworld Phú Quốc'}</p>
          <p style={{ fontSize:13, color:'#555', marginBottom:2 }}>
            {checkin}/06/2026 - {checkout}/06/2026 (1 đêm)
          </p>
          <p style={{ fontSize:13, color:'#555' }}>
            Người lớn / Trẻ em / Em bé: {adults} / 0 / 0
          </p>
        </div>

        {/* Room info */}
        <div style={{ background:'white', borderRadius:14, padding:'14px', marginBottom:10, boxShadow:'0 1px 6px rgba(0,0,0,.06)' }} className="slide-up slide-up-1">
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10 }}>
            <span style={{ fontSize:20 }}>🛏</span>
            <span style={{ fontSize:14, fontWeight:700, color:'#333' }}>Thông tin phòng</span>
          </div>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <div>
              <span style={{ fontSize:13, fontWeight:700, color:'#333' }}>Phòng 1: </span>
              <span style={{ fontSize:13, color:'#555' }}>{room?.name || 'Biệt Thự 2 Phòng Ngủ'}</span>
            </div>
            <span style={{ fontSize:14, fontWeight:700, color:'#333' }}>{fmt(room?.price || 6954000)}</span>
          </div>
        </div>

        {/* Add services */}
        <div style={{ background:'white', borderRadius:14, padding:'14px', marginBottom:10, boxShadow:'0 1px 6px rgba(0,0,0,.06)', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'space-between' }} className="slide-up slide-up-2">
          <div style={{ display:'flex', alignItems:'center', gap:10, flex:1 }}>
            <div style={{ width:40, height:40, borderRadius:10, background:'#FFF8EE', display:'flex', alignItems:'center', justifyContent:'center', fontSize:22, flexShrink:0 }}>🛍</div>
            <div>
              <p style={{ fontSize:14, fontWeight:700, color:'#333', marginBottom:2 }}>Mua Thêm Dịch Vụ</p>
              <p style={{ fontSize:12, color:'#888', lineHeight:1.4 }}>Đặt Trước vé Vinwonder buffer, spa, đưa đón sân bay, và các dịch vụ khác tại Vinpearl</p>
            </div>
          </div>
          <span style={{ fontSize:18, color:'#ccc', flexShrink:0, marginLeft:8 }}>›</span>
        </div>

        {/* Extra space before footer */}
        <div style={{ height:16 }} />
      </div>

      {/* Price footer */}
      <div className="price-footer">
        <div>
          <p style={{ fontSize:11, color:'#888' }}>Tổng giá (Bao gồm thuế & phí)</p>
          <p style={{ fontSize:17, fontWeight:900, color:'#E3A01E' }}>{fmt(room?.price || 6954000)}</p>
        </div>
        <button className="btn-orange" style={{ width:'auto', padding:'12px 28px', fontSize:15, borderRadius:12 }} onClick={onBook}>
          Đặt ngay
        </button>
      </div>
    </div>
  );
}

// ─── SCREEN: BOOKER INFO ──────────────────────────────────────────────────────

            <div className="step-circle" style={{ background:'#E3A01E', color:'white' }}>1</div>

          </div>

          <div style={{ display:'flex', alignItems:'center', gap:6 }}>

          <div style={{ display:'flex', alignItems:'center', gap:6 }}>

          <img src={VINPEARL_LOGO} alt="VP" style={{ width:22, height:22, objectFit:'contain', flexShrink:0 }} />
          <p style={{ fontSize:12.5, color:'#1D4ED8', lineHeight:1.4 }}>

        {/* Last name */}

        {/* First name */}
        <div className="form-row">
          <label className="form-label">Tên đệm & Tên (không dấu) <span style={{ color:'#e53e3e' }}>*</span></label>
          <input className="form-input" value={form.first_name} onChange={e => set('first_name', e.target.value)} />

        <div className="form-row">

          <input className="form-input" type="email" value={form.email} onChange={e => set('email', e.target.value)} />

        {/* Phone */}
        <div className="form-row">
          <label className="form-label">Số điện thoại <span style={{ color:'#e53e3e' }}>*</span></label>

      <div style={{ textAlign:'center' }} className="fade-in">

        <p style={{ fontSize:14, color:'#666', marginBottom:4 }}>{hotel?.name}</p>

}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('home');
  const [chatOpen, setChatOpen] = useState(false);
  const [autoFilled, setAutoFilled] = useState(false);

  const [searchData, setSearchData] = useState({ dest:'pq', checkin:'05', checkout:'06', rooms:1, adults:2 });
  const [selectedHotel, setSelectedHotel] = useState(null);
  const [selectedRoom, setSelectedRoom] = useState(null);

  const go = s => setScreen(s);
  const reset = () => { setScreen('home'); setChatOpen(false); setSelectedHotel(null); setSelectedRoom(null); setAutoFilled(false); };

  const handleChatNavigate = (action) => {
    setChatOpen(false);
    if (action.type === 'navigate' && action.screen === 'hotel_list') {
      setSearchData(d => ({...d, dest: action.dest}));
      setAutoFilled(true);
      go('hotel_list');
    }
  };

  const screensWithChat = ['home', 'hotel_search', 'hotel_list', 'room_list', 'journey_summary'];
  const showFAB = screensWithChat.includes(screen) && !chatOpen;

  const renderScreen = () => {
    switch(screen) {
      case 'home':
        return <HomeScreen onNav={s => s==='hotel_search' ? go('hotel_search') : null} onOpenChat={() => setChatOpen(true)} />;

      case 'hotel_search':
        return <HotelSearchScreen onBack={() => go('home')} onSearch={d => { setSearchData(d); go('hotel_list'); }} />;

      case 'hotel_list':
        return <HotelListScreen
          dest={searchData.dest} checkin={searchData.checkin} checkout={searchData.checkout}
          rooms={searchData.rooms} adults={searchData.adults}
          onSelect={h => { setSelectedHotel(h); go('room_list'); }}
          onBack={() => go('hotel_search')} />;

      case 'room_list':
        return <RoomListScreen
          hotel={selectedHotel} checkin={searchData.checkin} checkout={searchData.checkout} adults={searchData.adults}
          onSelect={r => { setSelectedRoom(r); go('journey_summary'); }}
          onBack={() => go('hotel_list')} />;

      case 'journey_summary':
        return <JourneySummaryScreen
          hotel={selectedHotel} room={selectedRoom} checkin={searchData.checkin} checkout={searchData.checkout} adults={searchData.adults}
          onBook={() => go('booker_info')}
          onBack={() => go('room_list')} />;

      case 'booker_info':
        return <BookerInfoScreen
          hotel={selectedHotel} room={selectedRoom}
          total={selectedRoom?.price}
          autoFilled={autoFilled}
          onBack={() => go('journey_summary')}
          onConfirm={() => go('booking_confirmed')} />;

      case 'booking_confirmed':
        return <BookingConfirmedScreen hotel={selectedHotel} room={selectedRoom} total={selectedRoom?.price} onHome={reset} />;

      default:
        return <HomeScreen onNav={s => s==='hotel_search' ? go('hotel_search') : null} onOpenChat={() => setChatOpen(true)} />;
    }
  };

  return (
    <>
      {renderScreen()}
      {chatOpen && <ChatWidget onClose={() => setChatOpen(false)} onNavigate={handleChatNavigate} />}
      {showFAB && (
        <button className="chat-fab" onClick={() => setChatOpen(true)} title={APP_NAME}
          style={{ background:'#fff', padding:0, border:'2px solid #E3A01E', overflow:'hidden' }}>
          <img src={VINPEARL_LOGO} alt={APP_NAME} style={{ width:'100%', height:'100%', objectFit:'contain', padding:6 }} />
        </button>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
